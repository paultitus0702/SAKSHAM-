[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saksham-engine"
version = "0.1.0-alpha"
description = "Sovereign Structure-Aware Sparse Optimization Engine for India's Industrial Systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "highspy>=1.7",
    "networkx>=3.1",
    "pydantic>=2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["saksham*"]
