[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saksham-backend"
version = "0.1.0-alpha"
description = "FastAPI backend for SAKSHAM Sovereign Optimization Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
